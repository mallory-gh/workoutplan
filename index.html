<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym Log">
<meta name="theme-color" content="#0f1115">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Gym Log</title>
<style>
:root{
  --bg:#0f1115;--card:#181b22;--card2:#232833;--field:#1f232c;--line:#2b303b;
  --text:#eef0f4;--muted:#8d94a3;--accent:#ff7a1a;--accent-ink:#1d0e00;
  --good:#2ecc71;--good-bg:rgba(46,204,113,.14);--blue:#4aa3ff;--danger:#ff5d5d;
  --pb:#ffc83d;--pb-bg:rgba(255,200,61,.16);--tab-bg:rgba(18,20,26,.92);--shadow:0 10px 40px rgba(0,0,0,.5);
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#f2f3f6;--card:#ffffff;--card2:#eceef3;--field:#f4f5f8;--line:#dde0e7;
    --text:#14161b;--muted:#656c7b;--accent:#e8600a;--accent-ink:#ffffff;
    --good:#1f9d55;--good-bg:rgba(31,157,85,.12);--blue:#1f7ae0;--danger:#d93b3b;
    --pb:#b98200;--pb-bg:rgba(255,190,40,.2);--tab-bg:rgba(255,255,255,.94);--shadow:0 10px 40px rgba(0,0,0,.18);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(80px + env(safe-area-inset-bottom)) env(safe-area-inset-left);
  overscroll-behavior-y:none}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer;border:0;background:none;padding:0;margin:0}
input,select,textarea{font:inherit;font-size:17px;color:var(--text);background:var(--field);border:1px solid var(--line);border-radius:12px;min-height:48px;padding:0 12px;width:100%}
textarea{padding:10px 12px;min-height:72px}
select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 12px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:30px}
h1,h2,h3{margin:0;line-height:1.15}
h1{font-size:30px;letter-spacing:-.02em}
h2{font-size:20px}
h3{font-size:18px}
small{font-size:12px}
.muted{color:var(--muted)}
#view{max-width:780px;margin:0 auto;padding:10px 10px 24px}
@media (min-width:600px){#view{padding:18px 20px 30px}}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:var(--tab-bg);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);z-index:20}
.tabs button{flex:1;max-width:190px;min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted)}
.tabs button.on{color:var(--accent)}
.tabs svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* generic */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 12px;margin:12px 0}
@media (min-width:600px){.card{padding:18px}}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:0 18px;border-radius:14px;background:var(--card2);font-weight:650;width:100%;font-size:17px;text-align:center}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger)}
.btn.sm{min-height:46px;font-size:15px;padding:0 14px;width:auto}
.btn:active,.chip:active,.step:active,.val:active,.chk:active,.row:active{transform:scale(.97)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.label{font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:18px 2px 8px}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--card2);color:var(--muted);letter-spacing:0;text-transform:none;vertical-align:middle}
.tag.good{background:var(--good-bg);color:var(--good)}
.tag.acc{background:var(--accent);color:var(--accent-ink)}
.tag.pb{background:var(--pb-bg);color:var(--pb)}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:999px;background:var(--card2);font-weight:600;font-size:15px}
.chip.on{background:var(--accent);color:var(--accent-ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:14px;padding:10px 12px;margin:10px 0;font-size:15px}
.banner.warn{border-left-color:var(--danger)}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;z-index:60;box-shadow:var(--shadow);max-width:90vw;text-align:center}

/* home */
.hero{padding:10px 4px 2px}
.hero .sub{color:var(--muted);margin-top:4px;font-size:16px}
.todaycard h2{font-size:26px;margin:6px 0 4px}
.todaycard .btn{margin-top:14px;min-height:60px;font-size:19px}
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:10px 12px;border-radius:14px;background:var(--card);border:1px solid var(--line);text-align:left}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:650;font-size:17px}
.row .s{color:var(--muted);font-size:14px;margin-top:2px}
.row .chev{color:var(--muted);font-size:22px}
.badge{flex:none;width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;background:var(--card2)}
.badge.acc{background:var(--accent);color:var(--accent-ink)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.week div{text-align:center;font-size:12px;color:var(--muted)}
.dot{width:34px;height:34px;margin:4px auto 0;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--muted)}
.dot.w{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.dot.c{background:var(--blue);border-color:var(--blue);color:#fff}
.dot.r{border-style:dashed}
.dot.today{outline:2px solid var(--text);outline-offset:2px}

/* workout */
.bar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:8px;padding:8px 2px;margin:-10px -10px 0;padding-left:10px;padding-right:10px;background:var(--bg);border-bottom:1px solid var(--line)}
@media (min-width:600px){.bar{margin:-18px -20px 0;padding-left:20px;padding-right:20px}}
.bar .back{min-height:46px;min-width:46px;padding:0 10px 0 4px;font-size:17px;font-weight:600;color:var(--accent)}
.bar .title{flex:1;min-width:0;text-align:center}
.bar .title b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .title small{color:var(--muted)}
.bar .menu{min-height:46px;min-width:46px;font-size:24px;font-weight:700;color:var(--accent)}
.progressbar{height:6px;border-radius:3px;background:var(--card2);overflow:hidden;margin:12px 2px 0}
.progressbar i{display:block;height:100%;background:var(--good);border-radius:3px}
.ex{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 10px;margin:12px 0}
@media (min-width:600px){.ex{padding:16px}}
.ex.complete{border-color:var(--good)}
.ex-head{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.ex-head h3{padding-top:4px}
.swapped{font-size:13px;color:var(--blue);margin-top:3px;font-weight:600}
.last{margin:8px 0 6px;font-size:14px;color:var(--muted);background:var(--field);border-radius:10px;padding:8px 10px}
.last b{color:var(--text);font-weight:650}
.last .pbt{color:var(--pb);font-weight:700}
.sethead,.set{display:grid;grid-template-columns:26px 44px minmax(58px,1fr) 44px minmax(60px,.9fr) 48px;gap:6px;align-items:center}
@media (min-width:600px){.sethead,.set{grid-template-columns:34px 60px minmax(90px,1fr) 60px minmax(90px,.8fr) 64px;gap:10px}}
.sethead{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:6px 0 2px}
.sethead span{text-align:center}
.set{padding:4px 0}
.set .sn{text-align:center;font-weight:800;color:var(--muted);font-size:16px;position:relative}
.set .step{height:52px;border-radius:12px;background:var(--card2);font-size:28px;font-weight:500;line-height:1}
.set .val{height:52px;border-radius:12px;background:var(--field);border:1px solid var(--line);font-size:20px;font-weight:750;font-variant-numeric:tabular-nums;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}
.set .val small{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.set .val.hint{color:var(--muted)}
.set .val.wide{grid-column:2 / 6}
.set .chk{height:52px;border-radius:12px;border:2px solid var(--line);font-size:24px;font-weight:800;color:var(--muted)}
.set.done .chk{background:var(--good);border-color:var(--good);color:#04210f}
.set.done .val{background:var(--good-bg);border-color:transparent}
.set.pb .val:not(.reps){box-shadow:inset 0 0 0 2px var(--pb)}
.pbb{display:block;font-size:9px;font-weight:800;color:var(--pb);letter-spacing:.02em}
.ex-foot{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.ex-foot .chip{flex:1;justify-content:center;min-height:46px}
.ex-foot .chip.stepchip{flex:none}
@media (min-width:600px){.set .step,.set .val,.set .chk{height:58px}}

/* sheets */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:88vh;overflow:auto;-webkit-overflow-scrolling:touch;background:var(--card);border-radius:22px 22px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:var(--shadow)}
@media (min-width:700px){.overlay{align-items:center}.sheet{border-radius:22px;padding-bottom:20px}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.sheet h3{font-size:20px;margin-bottom:4px}
.sheet .btn{margin-top:10px}
.kp-display{font-size:44px;font-weight:800;text-align:center;padding:10px;border-radius:14px;background:var(--field);margin:10px 0;font-variant-numeric:tabular-nums;min-height:76px}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kp button{min-height:60px;border-radius:14px;background:var(--card2);font-size:26px;font-weight:650}
.numgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:10px}
.numgrid button{min-height:54px;border-radius:12px;background:var(--card2);font-size:20px;font-weight:700}
.numgrid button.on{background:var(--accent);color:var(--accent-ink)}
.toggle{display:flex;align-items:center;gap:12px;min-height:52px;width:100%;padding:0 4px;font-weight:600;text-align:left}
.toggle .box{flex:none;width:30px;height:30px;border-radius:9px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:900}
.toggle.on .box{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.sug{display:flex;flex-direction:column;gap:6px;margin-top:8px;max-height:40vh;overflow:auto}
.sug button{min-height:52px;text-align:left;padding:8px 12px;border-radius:12px;background:var(--card2)}
.sug button small{display:block;color:var(--muted)}

/* history */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 10px;text-align:center}
.stat b{display:block;font-size:26px}
.stat span{font-size:12px;color:var(--muted);font-weight:600}
.cal-head{display:flex;align-items:center;justify-content:space-between}
.cal-head button{min-width:48px;min-height:48px;font-size:24px;color:var(--accent);font-weight:700}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:6px}
.cal .dow{text-align:center;font-size:12px;color:var(--muted);font-weight:700;padding:4px 0}
.cal button{min-height:46px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-weight:600;font-size:15px}
.cal button.out{opacity:.3}
.cal button.sel{background:var(--card2)}
.cal button.today{box-shadow:inset 0 0 0 2px var(--line)}
.cal .pips{display:flex;gap:3px;height:6px}
.cal .pips i{width:6px;height:6px;border-radius:50%}
.pip-w{background:var(--accent)}.pip-c{background:var(--blue)}.pip-r{background:var(--muted)}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);margin-top:8px;justify-content:center}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}

/* progress */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:12px}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.chart .pt{fill:var(--card);stroke:var(--accent);stroke-width:2.5}
.chart .pt.pb{fill:var(--pb);stroke:var(--pb)}
.pbcard{display:flex;align-items:center;gap:14px}
.pbcard .trophy{font-size:34px}
.pbcard b{font-size:24px}

/* program editor */
.field{margin:10px 0}
.field label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:0 2px 6px}
.wkrow{display:grid;grid-template-columns:56px 1fr;gap:10px;align-items:center;margin:6px 0}
.wkrow b{font-size:15px}
.dayed{border:1px solid var(--line);border-radius:16px;padding:12px;margin:12px 0;background:var(--card)}
.dayed-head{display:grid;grid-template-columns:1fr auto auto auto;gap:6px;align-items:center}
.iconbtn{min-width:46px;min-height:46px;border-radius:12px;background:var(--card2);font-size:18px;font-weight:700}
.iconbtn.danger{color:var(--danger)}
.exed{border-top:1px solid var(--line);padding:10px 0 4px;margin-top:10px}
.exed-row{display:grid;grid-template-columns:100px 1fr auto auto auto;gap:6px;margin-top:6px}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
</style>
</head>
<body>
<main id="view"></main>
<nav class="tabs" id="tabs"></nav>
<div id="sheet-root"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<script>
'use strict';
/* =========================================================
   Gym Log — single-file gym tracker. Data lives in localStorage.
   ========================================================= */
const KEY = 'gymtracker.v1';
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const WEEK_ORDER = [1,2,3,4,5,6,0]; // Mon-first
const TYPES = { w:'Weight × reps', bw:'Bodyweight', t:'Timed (sec)', m:'Mobility' };
const TYPE_SHORT = { w:'Weight', bw:'Bodyweight', t:'Timed', m:'Mobility' };
const CARDIO_TYPES = ['Treadmill','Incline walk','Bike','Elliptical','Rower','Stair climber','Outdoor walk','Run','Other'];

/* ---------- Preloaded program: Push/Pull/Legs Block A ----------
   type codes: w = weight × reps, bw = bodyweight (+ optional added weight),
               t = timed (seconds), m = mobility / stretch (reps only) */
const SEED_NAME = 'Push/Pull/Legs Block A';
const SEED_DAYS = [
 ['Day A – Push', `
Cat Cow|1|m
Active Bent Arm Pec Stretch|1|m
Side Lying Thoracic Rotation|1|m
Scapular Push-Up|3|bw
Push Up|3|bw
Barbell Bench Press|3|w
Plate Loaded Overhead Press|3|w
Dips|3|bw
Lying Dumbbell Triceps Extension|3|w
Dumbbell Incline Chest Fly|3|w
1-Arm Cable Front Raise|3|w`],
 ['Day B – Pull', `
Active Lat Stretch|1|m
Back Lying Trunk Rotation|1|m
Scapular Floor Slides|1|m
Half Kneel Cable Rotational Chop|3|w
Straight Arm Hang|1|t
Neutral Grip Loaded Pull Up|3|w
Overhand Grip Seated Cable Row|3|w
Overhand Grip Lat Pulldown|3|w
Reclined Dumbbell Biceps Curl|3|w
Chest-Supported Dumbbell Reverse Fly|3|w
1-Arm Cable Biceps Curl|3|w`],
 ['Day C – Lower/Core', `
Active 90/90 Hip Stretch|1|m
Lying Bent Knee Hamstring Stretch|1|m
Active Half Kneel Quads Stretch|1|m
Toe Touch Deep Squat|3|bw
Split Squat|3|bw
Back Loaded Barbell Squat|3|w
Single Leg Barbell Romanian Deadlift|3|w
Dumbbell Deficit Bulgarian Split Squat|3|w
Selectorized Seated Leg Extension|3|w
Plate Loaded Seated Calf Raise|3|w
Stability Ball Body Saw|3|bw
Tall Kneel Cable Trunk Rotation|3|w`],
 ['Day D – Push', `
Cat Cow|1|m
Active Bent Arm Pec Stretch|1|m
Side Lying Thoracic Rotation|1|m
Scapular Push-Up|3|bw
Push Up|3|bw
Plate Loaded Incline Press|3|w
Seated Dumbbell Overhead Press|3|w
Close Grip Push Up|3|bw
Selectorized Chest Fly|3|w
Cable Triceps Extension|3|w
1-Arm Cable Lateral Raise|3|w`],
 ['Day E – Pull', `
Active Lat Stretch|1|m
Back Lying Trunk Rotation|1|m
Scapular Floor Slides|1|m
Half Kneel Cable Rotational Chop|3|w
Straight Arm Hang|1|t
Underhand Grip Bent-Over Barbell Row|3|w
Neutral Grip Lat Pulldown|3|w
Dumbbell Pullover|3|w
Dumbbell Hammer Curl|3|w
Dumbbell Bent Over Reverse Fly|3|w
Selectorized Bicep Curl|3|w`],
 ['Day F – Lower/Core', `
Active 90/90 Hip Stretch|1|m
Lying Bent Knee Hamstring Stretch|1|m
Active Half Kneel Quads Stretch|1|m
Toe Touch Deep Squat|3|bw
Split Squat|3|bw
Barbell Good Morning|3|w
Cable Step Down|3|w
Plate Loaded Leg Press|3|w
Selectorized Seated Leg Curl|3|w
Stability Ball Crossover Crunch|3|bw
Roman Chair Lateral Bend|3|bw
Dumbbell Standing Calf Raise|3|w`],
];

/* ---------- utils ---------- */
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-5);
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const todayStr = () => ymd(new Date());
const parseYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
const daysBetween = (a, b) => Math.round((parseYmd(b) - parseYmd(a)) / 86400000);
const fmtDate = (s, o) => parseYmd(s).toLocaleDateString(undefined, o || { month: 'short', day: 'numeric' });
const keyOf = n => String(n || '').toLowerCase().replace(/[-–—_]/g, ' ').replace(/\s+/g, ' ').trim();
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pl = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');
const round2 = n => Math.round(n * 100) / 100;
const fmtW = w => (w == null ? '' : String(round2(w)));
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isStandalone = () => window.navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
const dayLetter = (d, i) => { const m = /day\s+([a-z0-9]+)/i.exec(d.name); return m ? m[1].toUpperCase().slice(0, 2) : String(i + 1); };

/* ---------- state ---------- */
function seedProgram() {
  const days = SEED_DAYS.map(([name, list]) => ({
    id: uid(), name,
    exercises: list.trim().split('\n').map(l => { const [n, s, t] = l.split('|'); return { id: uid(), name: n.trim(), sets: +s, type: t.trim() }; })
  }));
  const weekdays = { 0: 'rest' };
  for (let i = 1; i <= 6; i++) weekdays[i] = days[i - 1].id; // Mon=A … Sat=F, Sun=Rest
  return { id: uid(), name: SEED_NAME, startDate: todayStr(), weeks: 5, days, weekdays };

/* ----- Progress ----- */
function exerciseIndex() {
  const map = new Map();
  for (const s of S.sessions) if (s.kind === 'workout') for (const e of s.entries) {
    const sets = e.sets.filter(x => x.done); if (!sets.length) continue;
    const k = keyOf(e.exercise); let o = map.get(k);
    if (!o) { o = { name: e.exercise, type: e.type, n: 0, last: '', best: null }; map.set(k, o); }
    o.n++; if (s.date >= o.last) { o.last = s.date; o.name = e.exercise; o.type = e.type; }
    for (const x of sets) if (better(x, o.best)) o.best = x;
  }
  return [...map.values()].sort((a, b) => (a.type === 'm') - (b.type === 'm') || b.last.localeCompare(a.last));
}

const e1rm = x => (x.w || 0) * (1 + (x.r || 0) / 30);
function renderExercise() {
  const name = ui.screen.ex, h = historyFor(name);
  const type = h.length ? h[h.length - 1].e.type : (knownType(name) || 'w');

  const yLabel = metric === 'e1rm' ? 'Est. 1-rep max (' + unit() + ')' : useWeight ? 'Top set weight (' + unit() + ')' : (type === 't' ? 'Best seconds' : 'Best reps');

  out += `<div class="label">Every session</div><div class="rows">` + pts.slice().reverse().map(p => `<button class="row" data-a="openSession" data-id="${p.x.s.id}"><div class="grow"><div class="t">${fmtDate(p.date, { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' })} ${p.isPB ? '<span class="tag pb">🏆 PB</span>' : ''}</div><div class="s">${esc(setsSummary(p.x.sets, type))}${keyOf(p.x.e.original) !== keyOf(p.x.e.exercise) ? ' · swapped for ' + esc(p.x.e.original) : ''}</div></div><span class="chev">›</span></button>`).join('') + '</div>';

}
function chartSVG(pts) {
  const W = 640, H = 260, L = 46, R = 16, T = 16, B = 34;
  if (!pts.length) return '';
  let min = Math.min(...pts.map(p => p.v)), max = Math.max(...pts.map(p => p.v));
  if (min === max) { min = Math.max(0, min - 5); max = max + 5; }
  const rawStep = (max - min) / 4;
  const tick = [1, 2.5, 5, 10, 20, 25, 50, 100, 250, 500].find(s => s >= rawStep) || 1000;
  min = Math.max(0, Math.floor(min / tick) * tick); max = Math.ceil(max / tick) * tick;
  if (max - min < tick * 2) max = min + tick * 2;
  const t0 = parseYmd(pts[0].date).getTime(), t1 = parseYmd(pts[pts.length - 1].date).getTime();
  const xOf = (p, i) => pts.length === 1 ? (L + (W - L - R) / 2) : L + (W - L - R) * (t1 === t0 ? i / (pts.length - 1) : (parseYmd(p.date).getTime() - t0) / (t1 - t0));
  const yOf = v => T + (H - T - B) * (1 - (v - min) / (max - min));
  let g = '';
  for (let v = min; v <= max + 1e-9; v += tick) { const y = yOf(v); g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y}" y2="${y}"/><text x="${L - 8}" y="${y + 4}" text-anchor="end">${fmtW(v)}</text>`; }
  const line = pts.map((p, i) => `${xOf(p, i).toFixed(1)},${yOf(p.v).toFixed(1)}`).join(' ');
  const dots = pts.map((p, i) => `<circle class="pt ${p.isPB ? 'pb' : ''}" cx="${xOf(p, i).toFixed(1)}" cy="${yOf(p.v).toFixed(1)}" r="${p.isPB ? 7 : 5}"/>`).join('');
  const xl = `<text x="${L}" y="${H - 10}">${fmtDate(pts[0].date)}</text>` + (pts.length > 1 ? `<text x="${W - R}" y="${H - 10}" text-anchor="end">${fmtDate(pts[pts.length - 1].date)}</text>` : '');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Progress chart">${g}${pts.length > 1 ? `<polyline class="ln" points="${line}"/>` : ''}${dots}${xl}</svg>`;
}

  const f = ev.target.files[0]; if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (!data || !Array.isArray(data.programs) || !Array.isArray(data.sessions)) throw new Error('Not a Gym Log backup');
    const n = data.sessions.filter(s => s.kind === 'workout').length;
    if (!confirm(`Replace everything on this device with this backup?\n\n${data.programs.length} program(s), ${n} workout(s).`)) return;
    try { localStorage.setItem(KEY + '.preimport', JSON.stringify(S)); } catch (e) {}
    S = migrate(data); ui.screen = null; ui.tab = 'today'; rerender(); toast('Backup imported ✓');
  } catch (e) { alert('Could not import: ' + e.message); }
});
window.addEventListener('pageshow', () => render());
document.addEventListener('visibilitychange', () => { if (!document.hidden && !sheet) render(); });

render();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
